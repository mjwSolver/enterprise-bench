  # Slide 8: Risk Register (3-Column Architecture: Red, Orange, Yellow with 3-Box Scaling Meters)
  - archetype: risk_register
    tracker: "RISK GOVERNANCE & CONTROL MATRIX | 3-TIER ESCALATION"
