    y: 3.73
    w: 2.20
    h: 0.68
    stroke_hex: "#0284C7"
    fill_hex: "#F0F9FF"
    stroke_width: 1.5
    title_color: "#0369A1"
    subtitle_color: "#0284C7"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_receive"
    container_id: "group_safe_checker"
    title: "Receive Status"
    subtitle: "Response: Allowed / Not Allowed"
    x: 5.62
    y: 4.62
    w: 2.20
    h: 0.54
    stroke_hex: "#F59E0B"
    fill_hex: "#FFFBEB"
    stroke_width: 1.5
    title_color: "#B45309"
    subtitle_color: "#D97706"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_allowed"
    container_id: "group_safe_checker"
    kicker: "ALLOWED"
    title: "Continue"
    subtitle: "Rest of client\nexecution"
    icon: "assets/icons/lucide/check-circle_10B981.svg"
    x: 5.58
    y: 5.42
    w: 1.02
    h: 1.45
    stroke_hex: "#16A34A"
    fill_hex: "#F0FDF4"
    stroke_width: 1.5
    title_color: "#16A34A"
    subtitle_color: "#166534"
    valign: "top"
    title_pt: 11.0
    shape: "rounded"

  - id: "node_not_allowed"
    container_id: "group_safe_checker"
    kicker: "NOT ALLOWED"
