    y: 1.86
    w: 2.20
    h: 0.52
    stroke_hex: "#BAE6FD"
    fill_hex: "#E0F2FE"
    stroke_width: 1.0
    title_color: "#0369A1"
    subtitle_color: "#64748B"
    title_pt: 11.0
    shape: "rounded"

  - id: "node_step_connect"
    container_id: "group_safe_checker"
    title: "• Connect to Model Serving"
    x: 5.62
    y: 2.59
    w: 2.20
    h: 0.36
    stroke_hex: "#E2E8F0"
    fill_hex: "#F8FAFC"
    stroke_width: 1.0
    title_color: "#0F172A"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_mac"
    container_id: "group_safe_checker"
    title: "• Get MAC Addresses"
    x: 5.62
    y: 3.16
    w: 2.20
    h: 0.36
    stroke_hex: "#E2E8F0"
    fill_hex: "#F8FAFC"
    stroke_width: 1.0
    title_color: "#0F172A"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_send_api"
    container_id: "group_safe_checker"
    title: "Send request API to Model Serving"
    subtitle: "Payload: MAC + Client Identity"
