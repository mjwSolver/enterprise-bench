  - id: "node_model_serving"
    container_id: "group_backend"
    title: "Model Serving"
    subtitle: "Cloudera Machine Learning\nModel Serving Endpoint"
    icon: "assets/logos/cloudera/cloudera_ai.svg"
    x: 9.40
    y: 2.10
    w: 1.45
    h: 1.55
    stroke_hex: "#0284C7"
    fill_hex: "#FFFFFF"
    stroke_width: 2.5
    shape: "rounded"

  - id: "node_task"
    container_id: "group_backend"
    title: "1 Task"
    subtitle: "• Input metadata\n• SQL Query (Filter & Search)\n• Filter & Search Dev. ADD\n• Logging\n• Return Result"
    title_pt: 18.0
    valign: "top"
    align: "left"
    x: 11.20
    y: 2.10
    w: 1.65
    h: 3.10
    stroke_hex: "#DC2626"
    fill_hex: "#FFFFFF"
    stroke_width: 2.5
    shape: "rounded"

