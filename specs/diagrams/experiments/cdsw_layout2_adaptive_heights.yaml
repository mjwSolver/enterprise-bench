id: "cdsw_layout2_adaptive_heights"
name: "Candidate Layout 2: Adaptive Content-Hugging Containers (Safe-Checker Focal Hero)"
theme: "metrodata"

canvas:
  width: 13.333
  height: 7.5
  unit: "in"
  background: "#FFFFFF"
  show_grid: true
  grid_spacing: 60.0

header:
  show: true
  action_title: "Current: Legacy CDSW Job Execution (Expanded Hardware Safe-Checker)"
  subtitle: "Layout 2: Adaptive Content-Hugging Containers (Elevating Safe-Checker Security Gateway)"
  brand_stripes: true
  red_hex: "#E11D48"
  blue_hex: "#0284C7"

containers:
  - id: "group_user"
    label: "USER ORIGIN"
    x: 0.45
    y: 1.30
    w: 1.60
    h: 4.45
    border_hex: "#94A3B8"
    fill_hex: "#F8FAFC"
    fill_opacity: 0.5
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    align: "center"
    vertical_align: "top"

  - id: "group_device"
    label: "Local Device"
    x: 3.35
    y: 1.30
    w: 4.80
    h: 5.92
    border_hex: "#64748B"
    fill_hex: "#F8FAFC"
    fill_opacity: 0.5
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    align: "left"
    vertical_align: "top"

  - id: "group_safe_checker"
    label: ""
    x: 5.45
    y: 1.72
    w: 2.55
    h: 5.34
    border_hex: "#0284C7"
    fill_hex: "#FFFFFF"
    fill_opacity: 1.0
    stroke_width: 2.0
    dashed: false
    corner_radius: 12.0
    align: "center"
    vertical_align: "top"

  - id: "group_backend"
    label: "Backend Execution"
    x: 9.25
    y: 1.30
    w: 3.80
    h: 4.25
    border_hex: "#F59E0B"
    fill_hex: "#FFFBEB"
    fill_opacity: 0.35
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    tag_badge: "CLOUDERA CML"
    tag_bg_hex: "#FEF3C7"
    tag_text_hex: "#B45309"
    align: "left"
    vertical_align: "top"

nodes:
  - id: "node_user"
    container_id: "group_user"
    title: "User"
    subtitle: "Operator / Client"
    icon: "assets/icons/lucide/users_2563EB.svg"
    x: 0.58
    y: 1.86
    w: 1.34
    h: 1.55
    stroke_hex: "#3B82F6"
    fill_hex: "#FFFFFF"
    stroke_width: 2.0
    shape: "rounded"

  - id: "node_user_roles"
    container_id: "group_user"
    title: "EXAMPLE USERS"
    subtitle: "• Security\n• Finance\n• Fraud\n• etc."
    x: 0.58
    y: 3.65
    w: 1.34
    h: 1.85
    stroke_hex: "#CBD5E1"
    fill_hex: "#FFFFFF"
    stroke_width: 1.5
    valign: "top"
    align: "left"
    title_pt: 10.0
    shape: "rounded"

  - id: "node_exe"
    container_id: "group_device"
    title: "EXE"
    subtitle: "Client Executable\nSupports multiple types\n(recon_tool, audit)"
    icon: "assets/icons/lucide/cpu_0052CC.svg"
    x: 3.50
    y: 1.86
    w: 1.25
    h: 1.70
    stroke_hex: "#3B82F6"
    fill_hex: "#FFFFFF"
    stroke_width: 2.0
    shape: "rounded"

  - id: "node_safe_header"
    container_id: "group_safe_checker"
    title: "Safe Checker"
    subtitle: "Pre-Run Whitelist Verifier"
