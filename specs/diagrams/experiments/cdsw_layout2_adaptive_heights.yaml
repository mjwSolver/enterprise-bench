      - [4.75, 2.635]
      - [5.45, 2.635]
    stroke_hex: "#2563EB"
    stroke_width: 2.5

  - id: "flow_send_api"
    source: "node_step_send_api"
    target: "node_model_serving"
    points:
      - [7.82, 4.07]
      - [8.45, 4.07]
      - [8.45, 2.85]
      - [9.40, 2.85]
    label: "1. API Request"
    label_at: [8.65, 2.60]
    font_pt: 7.5
    stroke_hex: "#0284C7"
    stroke_width: 2.5
    label_bg_hex: "#F0F9FF"
    label_text_hex: "#0369A1"

  - id: "flow_model_to_task"
