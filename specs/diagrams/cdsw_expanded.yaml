id: "cdsw_expanded"
name: "Current: Legacy CDSW Job Execution"
theme: "metrodata"

canvas:
  width: 13.333
  height: 7.5
  unit: "in"
  background: "#FFFFFF"
  show_grid: true
  grid_spacing: 60.0

header:
  show: true
  action_title: "Current: Legacy CDSW Job Execution"
  subtitle: "Client Hardware Whitelist Verification, Model Serving & Bottleneck Execution Dataflow"
  y: 0.28
  brand_stripes: true
  red_hex: "#E11D48"
  blue_hex: "#0284C7"

containers:
  - id: "group_user"
    label: "USER ORIGIN"
    x: 0.45
    y: 1.35
    w: 1.60
    h: 5.90
    border_hex: "#94A3B8"
    fill_hex: "#F8FAFC"
    fill_opacity: 0.5
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    align: "center"
    vertical_align: "bottom"

  - id: "group_device"
    label: "Local Device"
    x: 2.70
    y: 1.35
    w: 5.35
    h: 5.90
    border_hex: "#64748B"
    fill_hex: "#F8FAFC"
    fill_opacity: 0.5
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    align: "left"
    vertical_align: "bottom"

  - id: "group_safe_checker"
    label: ""
    x: 4.30
    y: 1.72
    w: 3.50
    h: 5.34
    border_hex: "#0284C7"
    fill_hex: "#FFFFFF"
    fill_opacity: 1.0
    stroke_width: 2.0
    dashed: false
    corner_radius: 12.0
    align: "center"
    vertical_align: "top"

  - id: "group_backend"
    label: "Backend Execution"
    x: 8.50
    y: 1.35
    w: 4.40
    h: 5.90
    border_hex: "#F59E0B"
    fill_hex: "#FFFBEB"
    fill_opacity: 0.35
    stroke_width: 2.0
    dashed: true
    dash_pattern: "8 6"
    tag_badge: "CLOUDERA CML"
    tag_bg_hex: "#FEF3C7"
    tag_text_hex: "#B45309"
    align: "left"
    vertical_align: "top"

nodes:
  - id: "node_user"
    container_id: "group_user"
    title: "User"
    subtitle: "Operator / Client"
    icon: "assets/icons/lucide/users_2563EB.svg"
    x: 0.58
    y: 1.86
    w: 1.34
    h: 1.55
    stroke_hex: "#3B82F6"
    fill_hex: "#FFFFFF"
    stroke_width: 2.0
    shape: "rounded"

  - id: "node_user_roles"
    container_id: "group_user"
    title: "EXAMPLE USERS"
    subtitle: "• Security\n• Finance\n• Fraud\n• etc."
    x: 0.58
    y: 3.65
    w: 1.34
    h: 1.85
    stroke_hex: "#CBD5E1"
    fill_hex: "#FFFFFF"
    stroke_width: 1.5
    valign: "top"
    align: "left"
    title_pt: 10.0
    shape: "rounded"

  - id: "node_exe"
    container_id: "group_device"
    title: "EXE"
    subtitle: "Client Executable"
    icon: "assets/icons/lucide/cpu_0052CC.svg"
    x: 2.85
    y: 1.86
    w: 1.05
    h: 1.88
    stroke_hex: "#3B82F6"
    fill_hex: "#FFFFFF"
    stroke_width: 2.0
    shape: "rounded"

  - id: "node_safe_header"
    container_id: "group_safe_checker"
    title: "Safe Checker"
    subtitle: "Pre-Run Whitelist Verifier"
    icon: "assets/icons/lucide/shield_0052CC.svg"
    icon_layout: "side"
    x: 4.50
    y: 1.86
    w: 3.10
    h: 0.52
    stroke_hex: "#BAE6FD"
    fill_hex: "#E0F2FE"
    stroke_width: 1.0
    title_color: "#0369A1"
    subtitle_color: "#64748B"
    title_pt: 10.0
    shape: "rounded"

  - id: "node_step_connect"
    container_id: "group_safe_checker"
    title: "• Connect to Model Serving"
    x: 4.50
    y: 2.59
    w: 3.10
    h: 0.36
    stroke_hex: "#E2E8F0"
    fill_hex: "#F8FAFC"
    stroke_width: 1.0
    title_color: "#0F172A"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_mac"
    container_id: "group_safe_checker"
    title: "• Get MAC Addresses"
    x: 4.50
    y: 3.16
    w: 3.10
    h: 0.36
    stroke_hex: "#E2E8F0"
    fill_hex: "#F8FAFC"
    stroke_width: 1.0
    title_color: "#0F172A"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_send_api"
    container_id: "group_safe_checker"
    title: "Send REST Request"
    subtitle: "Payload: MAC + Identity"
    x: 4.50
    y: 3.73
    w: 3.10
    h: 0.68
    stroke_hex: "#0284C7"
    fill_hex: "#F0F9FF"
    stroke_width: 1.5
    title_color: "#0369A1"
    subtitle_color: "#0284C7"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_step_receive"
    container_id: "group_safe_checker"
    title: "Receive Status"
    subtitle: "Response: Allowed / Not Allowed"
    x: 4.50
    y: 4.62
    w: 3.10
    h: 0.54
    stroke_hex: "#F59E0B"
    fill_hex: "#FFFBEB"
    stroke_width: 1.5
    title_color: "#B45309"
    subtitle_color: "#D97706"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_allowed"
    container_id: "group_safe_checker"
    kicker: "ALLOWED"
    title: "Continue"
    subtitle: "Resume client\nexecution"
    icon: "assets/icons/lucide/check-circle_10B981.svg"
    x: 4.50
    y: 5.38
    w: 1.45
    h: 1.46
    stroke_hex: "#16A34A"
    fill_hex: "#F0FDF4"
    stroke_width: 1.5
    title_color: "#16A34A"
    subtitle_color: "#166534"
    valign: "top"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_not_allowed"
    container_id: "group_safe_checker"
    kicker: "NOT ALLOWED"
    title: "Stopped"
    subtitle: "Execution\nAborted"
    icon: "assets/icons/lucide/shield-alert_DC2626.svg"
    x: 6.15
    y: 5.38
    w: 1.45
    h: 1.46
    stroke_hex: "#DC2626"
    fill_hex: "#FEF2F2"
    stroke_width: 1.5
    title_color: "#DC2626"
    subtitle_color: "#991B1B"
    valign: "top"
    title_pt: 9.5
    shape: "rounded"

  - id: "node_model_serving"
    container_id: "group_backend"
    title: "Model Serving"
    subtitle: "Cloudera Machine Learning Model Serving Endpoint"
    icon: "assets/logos/cloudera/cloudera_ai.svg"
    icon_layout: "side"
    x: 9.05
    y: 1.95
    w: 3.25
    h: 1.80
    stroke_hex: "#0284C7"
    fill_hex: "#FFFFFF"
    stroke_width: 2.5
    shape: "rounded"

  - id: "node_task"
    container_id: "group_backend"
    title: "Code"
    subtitle: "• Input metadata\n• SQL Query (Filter & Search)\n• Filter & Search Dev. ADD\n• Logging\n• Return Result"
    valign: "middle"
    align: "center"
    x: 8.90
    y: 4.50
    w: 3.55
    h: 2.40
    stroke_hex: "#10B981"
    fill_hex: "#ECFDF5"
    stroke_width: 2.5
    title_color: "#047857"
    shape: "rounded"

badges:
  - id: "badge_if_else"
    x: 4.50
    y: 5.18
    w: 3.10
    h: 0.18
    text: "• If / Else Evaluation:"
    bg_hex: "#FFFFFF"
    text_hex: "#475569"
    border_hex: "#FFFFFF"
    font_pt: 8.5

  - id: "badge_run"
    x: 10.67
    y: 3.90
    w: 0.40
    h: 0.22
    text: "3. Run"
    bg_hex: "#F0F9FF"
    text_hex: "#0369A1"
    border_hex: "#BAE6FD"
    font_pt: 8.0

  - id: "badge_bottleneck"
    x: 9.25
    y: 4.10
    w: 1.05
    h: 0.26
    text: "BOTTLENECK"
    bg_hex: "#FEE2E2"
    text_hex: "#DC2626"
    border_hex: "#FECACA"
    font_pt: 8.0

  - id: "badge_sync"
    x: 11.10
    y: 4.10
    w: 1.15
    h: 0.26
    text: "SYNCHRONOUS"
    bg_hex: "#FEF3C7"
    text_hex: "#B45309"
    border_hex: "#FDE68A"
    font_pt: 8.0

flows:
  - id: "flow_user_to_exe"
    source: "node_user"
    target: "node_exe"
    points:
      - [1.92, 2.635]
      - [2.85, 2.635]
    label: "1. Trigger"
    label_at: [2.38, 2.40]
    stroke_hex: "#2563EB"
    stroke_width: 2.5
    label_bg_hex: "#EFF6FF"
    label_text_hex: "#1D4ED8"
    font_pt: 7.5

  - id: "flow_exe_to_safe"
    source: "node_exe"
    target: "group_safe_checker"
    points:
      - [3.90, 2.635]
      - [4.30, 2.635]
    stroke_hex: "#2563EB"
    stroke_width: 2.5

  - id: "flow_send_api"
    source: "node_step_send_api"
    target: "node_model_serving"
    points:
      - [7.60, 3.85]
      - [8.30, 3.85]
      - [8.30, 2.65]
      - [9.05, 2.65]
    label: "2. API Request"
    label_at: [7.92, 3.62]
    font_pt: 7.5
    stroke_hex: "#0284C7"
    stroke_width: 2.5
    label_bg_hex: "#F0F9FF"
    label_text_hex: "#0369A1"

  - id: "flow_model_to_task"
    source: "node_model_serving"
    target: "node_task"
    points:
      - [10.67, 3.75]
      - [10.67, 4.50]
    stroke_hex: "#0284C7"
    stroke_width: 2.5

  - id: "flow_model_to_receive"
    source: "node_model_serving"
    target: "node_step_receive"
    points:
      - [9.05, 3.25]
      - [8.70, 3.25]
      - [8.70, 4.89]
      - [7.60, 4.89]
    label: "4. Return Status"
    label_at: [8.12, 5.12]
    font_pt: 7.5
    stroke_hex: "#D97706"
    stroke_width: 2.5
    label_bg_hex: "#FFFBEB"
    label_text_hex: "#B45309"
