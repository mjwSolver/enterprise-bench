  # Slide 02: Before vs After Transformation Matrix (Gap Analysis Archetype)
  - archetype: gap_analysis
    tracker: "SYSTEM EVALUATION | BEFORE VS AFTER PARADIGM"
    title: "Replacing Unstructured AI Slides with Native MBB Engineering Cuts Synthesis Cycles by 60% and Prevents Decision Drift"
    subtitle: "Top-down SCQA narrative gating, quantitative action headlines, and deterministic layout routing convert generic bullet dumps into board-ready deliverables."
    left_title: "BEFORE: Naive / Generic LLM Generation"
    left_items:
      - "**Passive Category Titles:** Dumps generic topic labels without analytical conclusions or quantified operational impact."
      - "**Unanchored Formatting:** Emits uniform monotone styling without diagnostic signals for defects vs target states."
    right_title: "AFTER: Native MBB Hub-and-Spoke System"
    right_items:
      - "**Governing Action Headlines:** Enforces strict [Finding] + [Driver] + [Consequence] assertion syntax across every header."
      - "**Diagnostic Semantic Tokens:** Applies calibrated status colors restricted to genuine defect chips and execution gates."
    takeaway: "DECISION LEVER: Standardizing on deterministic MBB archetype routing eliminates manual slide iteration and aligns all 14 modernization workstreams under a single governance standard."
    source: "Enterprise Architecture Review Benchmark (N=142 pipelines); Enterprise-Bench Telemetry"

  # Slide 03: The Concrete Case — Nightly ETL SLA Breach (Split-Hero Archetype)
  - archetype: split_hero
    tracker: "CASE DEMO | OPERATIONAL ROOT-CAUSE ANALYSIS"
    title: "Nightly Hive ETL Exceeds 6-Hour SLA by 185m Due to Cartesian Joins; Migrating to Snowflake Restores 45m Target Window"
    subtitle: "Telemetry audit across 142 batch jobs reveals 78% cluster queue blockage at month-end; decoupled virtual warehouses isolate resource contention."
    hero_stat: "+185m"
    hero_stat_label: "Average Month-End SLA Breach"
    hero_stat_subtext: "Restores branch reporting SLA to 45 minutes; unblocks 142 batch pipelines."
    source: "Cluster Telemetry Audit Q3 2026 (YARN queue logs); Snowflake Large WH Benchmarks"
    blocks:
      - title: "Unindexed Hive Joins Exhaust YARN Cluster Memory"
        metric_badge: "P1 DEFECT"
        description: "Cartesian stage joins across legacy tables trigger massive data shuffles, exhausting memory pools and cascading job failures across all 12 operational branches."
      - title: "Monolithic Hadoop Couplings Starve Critical Batch Threads"
        metric_badge: "RESOURCE LOCK"
        description: "Shared architecture couples compute and storage; heavy ad-hoc analyst queries directly starve production ETL threads during month-end closing."
      - title: "Isolated Virtual Warehouses Guarantee 45-Minute Window"
        metric_badge: "TARGET STATE"
        description: "Migrating transformation layers to dedicated Snowflake Large virtual warehouses guarantees deterministic runtime SLAs with auto-suspend cost efficiency."

