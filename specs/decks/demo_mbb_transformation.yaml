  # Slide 02: Before vs After Transformation Matrix (Gap Analysis Archetype)
  - archetype: gap_analysis
    tracker: "SYSTEM EVALUATION | BEFORE VS AFTER PARADIGM"
    title: "Replacing Unstructured AI Slides with Native MBB Engineering Cuts Synthesis Cycles by 60% and Prevents Decision Drift"
    subtitle: "Top-down SCQA narrative gating, quantitative action headlines, and deterministic layout routing convert generic bullet dumps into board-ready deliverables."
    left_title: "BEFORE: Naive / Generic LLM Generation"
    left_subtitle: "Passive category headers, unquantified bullets, zero layout routing"
    left_items:
      - "**Passive Category Title:** Uses generic topic labels (e.g., 'Data Pipeline Challenges') with zero analytical conclusion or strategic direction."
      - "**Unanchored Bullets:** Dumps disconnected bullet points without MECE grouping, root cause attribution, or quantified impact metrics."
      - "**Arbitrary Styling:** Uniform generic blue boxes and decorative gradients with zero diagnostic signaling for defects vs target states."
      - "**Missing Footnote Rigor:** Unsubstantiated claims without telemetry source citations or sample size accountability."
    right_title: "AFTER: Native MBB Hub-and-Spoke System"
    right_subtitle: "Pyramid Principle, SCQA spine, Action Headlines, and deterministic layouts"
    right_items:
      - "**Governing Action Headline:** Complete sentence syntax expressing [Finding] + [Mechanical Driver] + [Operational Consequence]."
      - "**SCQA Storyline Gating:** Strict Situation -> Complication -> Core Question -> Resolution sequence before slide compilation."
      - "**Deterministic Archetype Routing:** Direct topology mapping to split_hero, gap_analysis, bcg_3_horizon, or dense runbooks."
      - "**Diagnostic Semantic Tokens:** Purposeful color signaling restricted to genuine defect chips and status diagnostics."
    takeaway: "EXECUTIVE TAKEAWAY: Replacing unstructured AI bullet dumps with deterministic MBB slidecraft ensures board-level clarity and cuts review cycles by 60%."
    source: "Enterprise Architecture Review Benchmark (N=142 pipelines); Enterprise-Bench Telemetry"

  # Slide 03: The Concrete Case — Nightly ETL SLA Breach (Split-Hero Archetype)
  - archetype: split_hero
    tracker: "CASE DEMO | OPERATIONAL ROOT-CAUSE ANALYSIS"
    title: "Nightly Hive ETL Exceeds 6-Hour SLA by 185m Due to Cartesian Joins; Migrating to Snowflake Restores 45m Target Window"
    subtitle: "Telemetry audit across 142 batch jobs reveals 78% cluster queue blockage at month-end; decoupled virtual warehouses isolate resource contention."
    hero_stat: "+185m"
    hero_stat_label: "Average Month-End SLA Breach"
    hero_stat_subtext: "142 batch pipelines block branch reporting; resolved via decoupled virtual warehouses."
    source: "Cluster Telemetry Audit Q3 2026 (YARN queue logs); Snowflake Large WH Benchmarks"
    blocks:
      - title: "The Operational Bottleneck (Complication)"
        metric_badge: "P1 DEFECT"
        category_tag: "DIMENSION 01"
        description: "Unindexed stage joins across legacy Hive tables trigger massive data shuffles, exhausting YARN memory pools and causing cascade job failures across all 12 operational branches."
      - title: "The Architectural Root Cause (Finding)"
        metric_badge: "RESOURCE LOCK"
        category_tag: "DIMENSION 02"
        description: "Shared monolithic Hadoop cluster couples storage and compute; heavy ad-hoc analyst queries directly starve production ETL threads during critical month-end closing cycles."
      - title: "The Decoupled Resolution (Action)"
        metric_badge: "TARGET STATE"
        category_tag: "DIMENSION 03"
        description: "Migrating transformation layers to isolated Snowflake Large virtual warehouses guarantees deterministic 45-minute runtime SLAs with zero queue contention and auto-suspend efficiency."

