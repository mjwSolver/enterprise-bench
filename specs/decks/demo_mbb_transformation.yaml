    takeaway: "EXECUTIVE ROADMAP TAKEAWAY: Immediate H1 batch offloading self-funds full dbt transpilation in H2, unlocking autonomous self-service analytics by H3."
    source: "Modernization Sequencing Model; Enterprise Architecture Practice Baseline"
    horizons:
