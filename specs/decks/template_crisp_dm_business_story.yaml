  # ===========================================================================
  # S18: APPENDIX A8 — Controlled Pilot Design
  # ===========================================================================
  - archetype: card_grid
    tracker: "APPENDIX A8  |  PILOT DESIGN"
    title: "A Deterministic Holdout Control Group Measures True Outreach Uplift"
    subtitle: "Proposed experimental design isolating causal call impact from baseline risk prediction."
    columns: 2
    items:
      - title: "Who Is Scored (Proposed)"
        accent_key: "primary"
        bullets:
          - "**Eligible slice:** Existing active accounts scheduled >= 2 days ahead, scored nightly at midnight."
          - "**Excluded:** Inbound escalation tickets already assigned to dedicated crisis queues."
      - title: "Control Group Design (Proposed)"
        accent_key: "accent"
        bullets:
          - "**10% uncalled slice:** Randomly hold out 10% of the high-risk third using a deterministic hash rule."
          - "**Reproducibility:** Fixed seed assignment keeps holdout auditing repeatable across regions."
      - title: "Primary Comparison Metric"
        accent_key: "accent"
        bullets:
          - "**Operational KPI:** Net missed renewals per 100 scored accounts (called treatment vs. uncalled control)."
          - "**Model gate:** Ranked lift must remain >= 1.25x the simple rule throughout the pilot."
      - title: "Prerequisites Before Launch"
        accent_key: "warning"
        bullets:
          - "**Capacity & logging:** Confirmed daily call quota per region and structured disposition tracking."
          - "**Governance sign-off:** Explicit approval to retain the 10% uncalled control slice."

