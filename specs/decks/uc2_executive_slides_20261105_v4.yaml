          - "Standardize Gardner Coding: Deploy Snowflake Cortex NLP to parse and structure free-form lab morphology notes."
          - "Straw-Level Barcoding: IT integrates physical straw foreign keys into electronic freeze-thaw workflows."
      - phase_number: "PHASE 03"
