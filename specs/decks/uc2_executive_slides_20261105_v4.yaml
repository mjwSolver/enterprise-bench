      - "SUB-SECOND RETRIEVAL (<2s)"
      - "ZERO-PII EMR IFRAME"
    takeaways_title: "CORE ARCHITECTURAL PILLARS"
    takeaways:
      - title: "Sub-Second Clinical Synthesis"
        body: "Aggregates ultrasound follicle scans, hormonal blood panels, and past cycle outcomes across multi-clinic visits into a unified executive dossier in <2 seconds."
        tag: "LATENCY REDUCTION"
        tag_color: "accent"
      - title: "Snowflake Cortex RAG Architecture"
        body: "Employs Cortex Search and Mistral-Large over governed clinical tables with zero-copy Iceberg federation—zero external data transfer or LLM vendor training."
