deck_type: pitch_deck
theme: snowblue
design_contract: technical_architecture
metadata:
  project_name: "UC-2 Data & Feature-Store Evolution (V1 -> V2 -> V3A -> V4A)"
  client_name: "Morula IVF Indonesia"
  vendor_name: "Data Science & ML Architecture Team"
  product: "Snowflake AI Data Cloud (DM-V2 -> DM-V4)"
  date_str: "November 2026"
  confidentiality: "UC-2 Feature-Store History  |  V1 -> V2 -> V3A -> V4A"

slides:
  # =========================================================================
  # PART 1: ONBOARDING NARRATIVE (SLIDES 1-7)
  # =========================================================================

  # Slide 1: Cover + Upfront Validation Lens Caption
  - archetype: cover
    tracker: "UC-2 FEATURE-STORE STORY  |  NOV 10 - NOV 12, 2026"
    title: "How Our IVF Data Mart Evolved Into a Clean 14-Clinic Feature Store"
    subtitle: "Validation Lens Notice: Clinical Pregnancy is used here as an end-to-end functional test spanning all scientific tables to verify data hygiene and cross-clinic portability—not as a replacement for the POSEIDON stimulation protocol suggestion service."
    client: "Morula IVF Indonesia"
    vendor: "Data Science & ML Architecture Team"
    product: "Snowflake Feature Store (V1 -> V2 -> V3A -> V4A)"
    date_str: "November 2026"

  # Slide 2: Why the Data Mart Was Needed in the First Place (2-Zone Composable Split)
  - archetype: composable_split
    tracker: "BACKGROUND  |  WHY WE BUILT THE DATA MART"
    title: "We Stitched Four Siloed Stage Tables Into One Mart and Used Clinical Pregnancy as a Smoke Test"
    subtitle: "Before building any model, we unified Stimulation, OPU, Embryo, and Transfer records with anonymized IDs and zero future leakage—purely to test data integrity, not to replace POSEIDON."
    split: [48, 52]
    gap: 0.35
    pane_divider: true
    panes:
      - widget: card_list
        header_bar: "SILOED STAGE TABLES (BEFORE)"
        style: "cards"
        items:
          - title: "01 · Stimulation & OPU (Raw Hormone & Egg Logs)"
            accent_key: "#94A3B8"
            bullets:
              - "**Inconsistent Keys:** Separate stage tables with mismatched join keys across visits."
              - "**Mixed Hormone Units:** Raw logs mix IU, MCG, and vials."
          - title: "02 · Embryo & Freeze (Lab Grading & Thaw)"
            accent_key: "#60A5FA"
            bullets:
              - "**760x Row Explosion:** Naive clinic joins multiply rows 760x."
              - "**Missing Thaw Link:** Frozen cycles lacked clean thaw-to-transfer linkage."
      - widget: card_list
        header_bar: "UNIFIED MART & SMOKE TEST (AFTER)"
        style: "cards"
        items:
          - title: "03 · Unified Transfer Mart (1 Row Per Transfer)"
            accent_key: "#0284C7"
            bullets:
              - "**Zero Future Leakage:** Pre-transfer facts only; post-outcome tables blocked."
              - "**Anonymized Identity:** Vault-salted patient IDs prevent MRN reverse-lookups."
          - title: "04 · Pregnancy Smoke Test (End-to-End Audit)"
            accent_key: "#1E3A8A"
            bullets:
              - "**Full-Pipeline Stress Test:** Forces every upstream join, thaw link, and unit to work."
              - "**Validation Lens Only:** Distinct from the POSEIDON protocol suggestion service."

  # Slide 3: Run V1 (Nov 10, 2026 - 14:47 WIB) — Hero KPI + Caught Mistakes
  - archetype: composable_split
    tracker: "ITERATION 1  |  NOV 10, 2026 (14:47 WIB)"
    title: "Version 1 Looked Strong (0.77) Until Newer Data Exposed a -0.125 Missing-Data Illusion"
    subtitle: "Training on all 22,125 historical transfers (2000-2026) taught the model to spot old, incomplete records rather than human biology."
    split: [35, 65]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "V1 REALITY CHECK (PAST VS. NEWER)"
        stat: "-0.125"
        stat_label: "0.767 Past Score Dropped to 0.642 on Newer Data"
        stat_subtext: "22,125 all-years rows (2000-2026). No patient IDs leaked, but trees cheated on old missing data."
        card_style: "filled"
      - widget: card_list
        header_bar: "CAUGHT AFTER TRAINING V1  ->  FIXED FOR V2"
        style: "cards"
        items:
          - title: "Caught #1: 42.7% Blank Pre-2019 Embryo Grades"
            description: "**Missingness = Failure Shortcut:** Pre-2019 transfers lacked lab grades, so trees simply predicted 'missing old data = failed cycle.'"
          - title: "Caught #2: 80,000 Response Spikes From '1 Vial' Logs"
            description: "**Broken Dose Units:** Old '1 vial' entries blew up ovarian response scores to 80,000 and misled the model."
          - title: "Caught #3: Unsettled Late-2026 Outcomes  ->  V2 Fix"
            description: "**Modern Window Cutoff:** Dropped all pre-2019 legacy rows and unsettled late-2026 transfers to keep only clean, settled cycles."

  # Slide 4: Run V2 (Nov 10, 2026 - 17:44 WIB) — Hero KPI + Native Chart
  - archetype: composable_split
    tracker: "ITERATION 2  |  NOV 10, 2026 (17:44 WIB)"
    title: "Version 2 Cleaned the Timeline (0.656), but Checks Caught the Model Cheating With Clinic Location"
    subtitle: "Restricting to 11,546 modern transfers (2019-2026) fixed old missing data—then feature checks showed Clinic Branch was the #1 Fresh driver."
    split: [34, 66]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "ILLEGAL SHORTCUT CAUGHT IN V2"
        stat: "#1"
        stat_label: "Clinic Branch Topped Fresh Decision Factors"
        stat_subtext: "Clinic Branch (0.307 impact) beat Maternal Age (0.273). Also caught staff-entry flags & missing grades saved as 0 (below Poor)."
        card_style: "filled"
      - widget: native_chart
        chart_type: "bar"
        title: "Caught After V2 Training: Top Fresh Decision Factors (N = 3,068)"
        subtitle: "Clinic Branch outweighed real patient biology—making Version 2 unsafe across branches"
        categories:
          - "Clinic Branch"
          - "Maternal Age"
          - "Fresh Transfer Days"
          - "Embryo Transfer Count"
          - "Prior Clinical Pregnancy"
          - "Prior Transfer Count"
        series:
          - name: "Impact Score"
            values: [0.307, 0.273, 0.195, 0.190, 0.134, 0.082]
            color: "danger"
        number_format: "0.000"
    footnote: "Fixed for V3A: Removed Clinic Branch and staff-entry flags from inputs, stored missing Grade as blank (not 0), and fixed unresolved genetic-test labels."

  # Slide 5: Run V3A (Nov 11, 2026 - 22:22 WIB) — Top KPI Strip + 3-Bucket Triage & Exposed Bugs
  - archetype: composable_split
    tracker: "ITERATION 3  |  NOV 11, 2026 (22:22 WIB)"
    title: "Version 3 Sorted Features Into 3 Buckets—Proving Biology Held (0.652) While Exposing 2 Data Bugs"
    subtitle: "Stripping shortcuts confirmed real biological signal, while audit checks revealed single-clinic lock-in and drug pollution."
    top_kpis:
      - stat: "12"
        label: "Bucket A: Kept"
        subtext: "Core biological features"
        color: "success"
      - stat: "7+"
        label: "Bucket B: Kicked Out"
        subtext: "Clinic ID & logging flags"
        color: "danger"
      - stat: "3"
        label: "Bucket C: Omitted"
        subtext: "Sparse AMH, AFC, PGT-A"
        color: "warning"
      - stat: "98.6%"
        label: "Caught After V3A"
        subtext: "Frozen stuck in Jakarta 1400"
        color: "#0F172A"
    split: [50, 50]
    gap: 0.35
    pane_divider: true
    panes:
      - widget: card_list
        header_bar: "THE 3-BUCKET FEATURE TRIAGE"
        style: "cards"
        items:
          - title: "Bucket A — Keep (12 Core Features)"
            accent_key: "success"
            description: "**True Biology:** Age, egg yield, maturity, grade, history, and hormone response with blanks left empty."
          - title: "Bucket B — Kick Out Permanently"
            accent_key: "danger"
            description: "**Illegal Shortcuts:** Deleted Clinic Branch, staff-entry flags, duplicate counters, and broken genetic-test flags."
          - title: "Bucket C — Omit on Purpose"
            accent_key: "warning"
            description: "**Sparse Recent Labs (AMH, AFC, PGT-A):** Too few rows—sends mixed/empty signals and wastes feature space."
      - widget: card_list
        header_bar: "CAUGHT AFTER TRAINING V3A  ->  TRIGGERED V4"
        style: "cards"
        items:
          - title: "Biology Survived Without Cheating (0.652)"
            accent_key: "success"
            description: "**Real Signal Confirmed:** Removing Clinic Branch barely moved Unified or Frozen scores—proving the underlying biology is genuine."
          - title: "Caught Bug #1: 98.6% Frozen Stuck in Jakarta 1400"
            accent_key: "#0F172A"
            description: "**12 Clinics Dropped:** The old Frozen join silently lost regional clinics."
          - title: "Caught Bug #2: 56.5% Non-Hormone Drug Pollution"
            accent_key: "#0F172A"
            description: "**Blind Dose Sum:** Source query lumped oral pills, progesterone, and triggers into 'gonadotropins.'"

  # Slide 6: Run V4A (Nov 12, 2026 - 14:53 WIB) — Hero KPI + Native Chart
  - archetype: composable_split
    tracker: "ITERATION 4  |  NOV 12, 2026 (14:53 WIB)"
    title: "Version 4 Rebuilt the Upstream Mart, Recovering +6,166 Frozen Transfers Across 14 Clinics"
    subtitle: "Repairing the Frozen thaw link and keeping only real stimulation hormones lifted unseen-clinic accuracy across both pathways."
    split: [35, 65]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "VERSION 4 MULTI-CLINIC RECOVERY"
        stat: "+6,166"
        stat_label: "Frozen Transfers Restored (14 Clinics)"
        stat_subtext: "Frozen grew 8,478 -> 14,644 (17,712 total). Kept only real hormones (IU/MCG); Ovarian Response Score jumped to #7 driver."
        card_style: "filled"
      - widget: native_chart
        chart_type: "column"
        title: "Unseen-Clinic Accuracy (0.50 = Random): V3A vs V4A"
        subtitle: "Holding out entire clinics proves Version 4 works across all 14 branches without Clinic ID"
        categories:
          - "Frozen Transfers (Unseen Clinics)"
          - "Fresh Transfers (Unseen Clinics)"
        series:
          - name: "V3A (Before Fix)"
            values: [0.500, 0.551]
            color: "muted"
          - name: "V4A (After Fix)"
            values: [0.559, 0.594]
            color: "success"
        number_format: "0.000"
    footnote: "Adding clean genetic-test labels in a separate side-test lifted unseen-clinic score to 0.603 and newer-patient score to 0.646 (+0.008)."

  # Slide 8 (Moved & Simplified from old Slide 11): Multi-Clinic Frozen FET Recovery Chart
  - archetype: composable_split
    tracker: "UPSTREAM RECOVERY  |  2 -> 14 CLINICS"
    title: "Fixing the 10-Day Thaw Link Expanded Frozen Transfers From 2 Clinics to All 14"
    subtitle: "Restoring +6,166 missing regional transfers (8,478 -> 14,644) eliminated single-clinic concentration and recalibrated the baseline."
    split: [66, 34]
    gap: 0.35
    panes:
      - widget: image
        image_path: "assets/charts/uc2_evolution/chart1_fet_recovery.png"
        show_card: true
      - widget: card_list
        header_bar: "WHAT THE CHART SHOWS"
        style: "cards"
        items:
          - title: "2 Clinics -> 14 Clinics"
            accent_key: "primary"
            bullets:
              - "**Root Fix:** Joined thaw and transfer dates within 10 days."
              - "**+6,166 Rows:** Frozen transfers grew +72.7% (17,712 total)."
          - title: "Baseline Recalibrated"
            accent_key: "amber"
            bullets:
              - "**45.9% -> 42.8%:** Adding regional clinics corrected Jakarta-1400 skew."

  # Slide 8 (Technical Scorecard): 4-Run Chronology Table (Moved after Slide 7)
  - archetype: composable_split
    tracker: "TECHNICAL SCORECARD  |  V1 TO V4A"
    title: "Four Rapid Runs Turned a Broken All-Years Baseline Into a Clean 14-Clinic Feature Store"
    subtitle: "Side-by-side summary of cohort size, what changed, what each audit caught, and newer-patient ROC-AUC before our final verdict."
    split: [100]
    gap: 0.0
    panes:
      - widget: table
        headers: ["Run", "Cohort (N)", "What Changed", "What the Audit Caught", "Newer-Patient ROC-AUC"]
        column_widths: [9, 17, 28, 30, 16]
        zebra: true
        rows:
          - ["**V1**", "22,125 (All Years)", "Unified 4 tables; anonymized IDs", "Pre-2019 missing grades; 80k vial dose", "0.6422"]
          - ["**V2**", "11,546 (2019+)", "2019+ window; >=50 IU dose floor", "Model cheated using Clinic ID; Grade=0", "0.6560"]
          - ["**V3A**", "11,546 (2019+)", "Removed Clinic ID; clean core only", "98.6% Frozen in 1 clinic; 56.5% co-meds", "0.6517"]
          - ["**V4A**", "17,712 (14 Clinics)", "10-day thaw bridge; rFSH/hMG IU only", "PGT-A +0.0080 ROC-AUC; AMH 95% blank", "0.6383 / 0.6463"]
    footnote: "Silver pre-transfer tables only (zero Gold leakage, SHA2 patient IDs, TEMP.ME_MARCELL). V4A = 0.6383 ROC-AUC (14 feats); V4A + PGT-A = 0.6463."

  # Slide 9 (Prev Slide 7): Conclusion — Hero KPI + Crisp 2-Card Verdict
  - archetype: composable_split
    tracker: "CONCLUSION  |  WHERE WE STAND"
    title: "The Feature Store Is Now Clean and Portable—But Not Ready for POSEIDON Protocol Suggestion"
    subtitle: "Four rapid iterations (Nov 10-12, 2026) proved the data foundation is trustworthy; readiness gates for POSEIDON are tracked separately."
    split: [34, 66]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "POSEIDON PROTOCOL READINESS"
        stat: "NOT YET"
        stat_label: "Clean 14-Clinic Foundation, Missing Pre-OPU Gates"
        stat_subtext: "Clinical Pregnancy proved table joins & clinic portability across Nov 10-12—keep updating the Version 4 dataset as new data lands."
        card_style: "filled"
      - widget: card_list
        header_bar: "FINAL TAKEAWAY FROM THIS 4-RUN AUDIT"
        style: "cards"
        items:
          - title: "What This Proxy Test Proved (Continue Iterating)"
            description: "**Zero Shortcuts Left:** Old missingness, clinic memorization, single-clinic lock-in, and drug pollution are fixed. Paused lab tests can promote as 2025-2026 coverage matures."
          - title: "Why It Is Not Ready for POSEIDON Yet"
            description: "**Different Clinical Question:** Predicting transfer outcome tests downstream joins; suggesting stimulation protocols for POSEIDON patients requires pre-cycle AMH/AFC & protocol gates (tracked in the separate assessment deck)."
