  # Slide 1: Cover + Upfront Validation Lens Caption
  - archetype: cover
    tracker: "UC-2 FEATURE-STORE STORY  |  NOV 10 - NOV 12, 2026"
    title: "How Our IVF Data Mart Evolved Into a Clean 14-Clinic Feature Store"
    subtitle: "Validation Lens Notice: Clinical Pregnancy is used here as an end-to-end functional test spanning all scientific tables to verify data hygiene and cross-clinic portability—not as a replacement for the POSEIDON stimulation protocol suggestion service."
    client: "Morula IVF Indonesia"
    vendor: "Data Science & ML Architecture Team"
    product: "Snowflake Feature Store (V1 -> V2 -> V3A -> V4A)"
    date_str: "November 2026"

  # Slide 2: Why the Data Mart Was Needed in the First Place (Visual Flow)
  - archetype: chevron_process
    tracker: "BACKGROUND  |  WHY WE BUILT THE DATA MART"
    title: "We Stitched Four Siloed Stage Tables Into One Mart and Used Clinical Pregnancy as a Smoke Test"
    subtitle: "Before building any model, we unified Stimulation, OPU, Embryo, and Transfer records with anonymized IDs and zero future leakage—purely to test data integrity, not to replace POSEIDON."
    steps:
      - num: "01"
        title: "Stimulation & OPU"
        status: "SILOED"
        accent_key: "accent"
        owner: "Raw Hormone & Egg Logs"
        deliverables:
          - "Separate stage tables with inconsistent join keys"
          - "Mixed hormone units (IU, MCG, vials)"
      - num: "02"
        title: "Embryo & Freeze"
        status: "DISCONNECTED"
        accent_key: "accent"
        owner: "Lab Grading & Thaw"
        deliverables:
          - "Bad clinic joins multiply rows 760x"
          - "Frozen cycles lacked clean thaw linkage"
      - num: "03"
        title: "Unified Transfer Mart"
        status: "DM-V2"
        accent_key: "primary"
        owner: "1 Row Per Transfer"
        deliverables:
          - "Anonymized IDs & post-outcome tables blocked"
          - "Pre-transfer facts only—no future leakage"
      - num: "04"
        title: "Pregnancy Smoke Test"
        status: "VALIDATION LENS"
        accent_key: "success"
        owner: "End-to-End Audit"
        deliverables:
          - "Forces every upstream join & unit to work"
          - "Distinct from POSEIDON protocol suggestion"

  # Slide 3: Run V1 (Nov 10, 2026 - 14:47 WIB) — Hero KPI + Caught Mistakes
  - archetype: composable_split
    tracker: "ITERATION 1  |  NOV 10, 2026 (14:47 WIB)"
    title: "Version 1 Looked Strong (0.77) Until Newer Data Exposed a -0.125 Missing-Data Illusion"
    subtitle: "Training on all 22,125 historical transfers (2000-2026) taught the model to spot old, incomplete records rather than human biology."
    split: [35, 65]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "V1 REALITY CHECK (PAST VS. NEWER)"
        stat: "-0.125"
        stat_label: "0.767 Past Score Dropped to 0.642 on Newer Data"
        stat_subtext: "22,125 all-years rows (2000-2026). No patient IDs leaked, but trees cheated on old missing data."
        card_style: "filled"
      - widget: card_list
        header_bar: "CAUGHT AFTER TRAINING V1  ->  FIXED FOR V2"
        style: "cards"
        items:
          - title: "Caught #1: 42.7% Blank Pre-2019 Embryo Grades"
            description: "**Missingness = Failure Shortcut:** Pre-2019 transfers lacked lab grades, so trees simply predicted 'missing old data = failed cycle.'"
          - title: "Caught #2: 80,000 Response Spikes From '1 Vial' Logs"
            description: "**Broken Dose Units:** Old '1 vial' entries blew up ovarian response scores to 80,000 and misled the model."
          - title: "Caught #3: Unsettled Late-2026 Outcomes  ->  V2 Fix"
            description: "**Modern Window Cutoff:** Dropped all pre-2019 legacy rows and unsettled late-2026 transfers to keep only clean, settled cycles."

  # Slide 4: Run V2 (Nov 10, 2026 - 17:44 WIB) — Hero KPI + Native Chart
  - archetype: composable_split
    tracker: "ITERATION 2  |  NOV 10, 2026 (17:44 WIB)"
    title: "Version 2 Cleaned the Timeline (0.656), but Checks Caught the Model Cheating With Clinic Location"
    subtitle: "Restricting to 11,546 modern transfers (2019-2026) fixed old missing data—then feature checks showed Clinic Branch was the #1 Fresh driver."
    split: [34, 66]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "ILLEGAL SHORTCUT CAUGHT IN V2"
        stat: "#1"
        stat_label: "Clinic Branch Topped Fresh Decision Factors"
        stat_subtext: "Clinic Branch (0.307 impact) beat Maternal Age (0.273). Also caught staff-entry flags & missing grades saved as 0 (below Poor)."
        card_style: "filled"
      - widget: native_chart
        chart_type: "bar"
        title: "Caught After V2 Training: Top Fresh Decision Factors (N = 3,068)"
        subtitle: "Clinic Branch outweighed real patient biology—making Version 2 unsafe across branches"
        categories:
          - "Clinic Branch"
          - "Maternal Age"
          - "Fresh Transfer Days"
          - "Embryo Transfer Count"
          - "Prior Clinical Pregnancy"
          - "Prior Transfer Count"
        series:
          - name: "Impact Score"
            values: [0.307, 0.273, 0.195, 0.190, 0.134, 0.082]
            color: "danger"
        number_format: "0.000"
    footnote: "Fixed for V3A: Removed Clinic Branch and staff-entry flags from inputs, stored missing Grade as blank (not 0), and fixed unresolved genetic-test labels."

  # Slide 5: Run V3A (Nov 11, 2026 - 22:22 WIB) — Top KPI Strip + 3-Bucket Triage & Exposed Bugs
  - archetype: composable_split
    tracker: "ITERATION 3  |  NOV 11, 2026 (22:22 WIB)"
    title: "Version 3 Sorted Features Into 3 Buckets—Proving Biology Held (0.652) While Exposing 2 Data Bugs"
    subtitle: "Stripping shortcuts confirmed real biological signal, while audit checks revealed single-clinic lock-in and drug pollution."
    top_kpis:
      - stat: "12"
        label: "Bucket A: Kept"
        subtext: "Core biological features"
        color: "success"
      - stat: "7+"
        label: "Bucket B: Kicked Out"
        subtext: "Clinic ID & logging flags"
        color: "danger"
      - stat: "3"
        label: "Bucket C: Omitted"
        subtext: "Sparse AMH, AFC, PGT-A"
        color: "warning"
      - stat: "98.6%"
        label: "Caught After V3A"
        subtext: "Frozen stuck in Jakarta 1400"
        color: "danger"
    split: [50, 50]
    gap: 0.35
    panes:
      - widget: card_list
        header_bar: "THE 3-BUCKET FEATURE TRIAGE"
        style: "cards"
        items:
          - title: "Bucket A — Keep (12 Core Features)"
            description: "**True Biology:** Age, egg yield, maturity, grade, history, and hormone response with blanks left empty."
          - title: "Bucket B — Kick Out Permanently"
            description: "**Illegal Shortcuts:** Deleted Clinic Branch, staff-entry flags, duplicate counters, and broken genetic-test flags."
          - title: "Bucket C — Omit on Purpose"
            description: "**Sparse Recent Labs (AMH, AFC, PGT-A):** Too few rows—sends mixed/empty signals and wastes feature space."
      - widget: card_list
        header_bar: "CAUGHT AFTER TRAINING V3A  ->  TRIGGERED V4"
        style: "cards"
        items:
          - title: "Biology Survived Without Cheating (0.652)"
            description: "**Real Signal Confirmed:** Removing Clinic Branch barely moved Unified or Frozen scores—proving the underlying biology is genuine."
          - title: "Caught Bug #1: 98.6% Frozen Stuck in Jakarta 1400"
            description: "**12 Clinics Dropped:** The old Frozen join silently lost regional clinics."
          - title: "Caught Bug #2: 56.5% Non-Hormone Drug Pollution"
            description: "**Blind Dose Sum:** Source query lumped oral pills, progesterone, and triggers into 'gonadotropins.'"

  # Slide 6: Run V4A (Nov 12, 2026 - 14:53 WIB) — Hero KPI + Native Chart
  - archetype: composable_split
    tracker: "ITERATION 4  |  NOV 12, 2026 (14:53 WIB)"
    title: "Version 4 Rebuilt the Upstream Mart, Recovering +6,166 Frozen Transfers Across 14 Clinics"
    subtitle: "Repairing the Frozen thaw link and keeping only real stimulation hormones lifted unseen-clinic accuracy across both pathways."
    split: [35, 65]
    gap: 0.35
    panes:
      - widget: hero_kpi
        eyebrow: "VERSION 4 MULTI-CLINIC RECOVERY"
        stat: "+6,166"
        stat_label: "Frozen Transfers Restored (14 Clinics)"
