        stat: "NOT YET"
        stat_label: "Clean 14-Clinic Foundation, Missing Pre-OPU Gates"
        stat_subtext: "Clinical Pregnancy proved table joins & clinic portability across Nov 10-12—keep updating the Version 4 dataset as new data lands."
        card_style: "filled"
      - widget: card_list
        header_bar: "FINAL TAKEAWAY FROM THIS 4-RUN AUDIT"
        style: "cards"
        items:
          - title: "What This Proxy Test Proved (Continue Iterating)"
            description: "**Zero Shortcuts Left:** Old missingness, clinic memorization, single-clinic lock-in, and drug pollution are fixed. Paused lab tests can promote as 2025-2026 coverage matures."
