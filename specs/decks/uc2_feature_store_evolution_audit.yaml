          - title: "Biological Signal Survived Intact"
            description: "**Minimal Drop in Unified & Frozen:** Unified temporal held at 0.6517 (-0.0043 vs V2) and Frozen FET held at 0.6258 (-0.0005 vs V2)."
          - title: "Two Upstream Mart Defects Exposed"
            description: "**Triggered DM-V4 Rebuild:** Audit metadata exposed 98.6% Frozen concentration in Jakarta 1400 and 56.48% non-gonadotropin co-meds in dose sums."

