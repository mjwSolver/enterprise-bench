          - "Fresh Transfers (Unseen Clinics)"
        series:
          - name: "V3A (Before Fix)"
            values: [0.500, 0.551]
            color: "muted"
          - name: "V4A (After Fix)"
            values: [0.559, 0.594]
            color: "success"
        number_format: "0.000"
    footnote: "Adding clean genetic-test labels in a separate side-test lifted unseen-clinic score to 0.603 and newer-patient score to 0.646 (+0.008)."

  # Slide 7: Conclusion — Hero KPI + Crisp 2-Card Verdict
  - archetype: composable_split
    tracker: "CONCLUSION  |  WHERE WE STAND"
    title: "The Feature Store Is Now Clean and Portable—But Not Ready for POSEIDON Protocol Suggestion"
    subtitle: "Four rapid iterations (Nov 10-12, 2026) proved the data foundation is trustworthy; readiness gates for POSEIDON are tracked separately."
    split: [34, 66]
