  # Slide 04: The Data Reality (Card Grid: 2 Columns)
  - archetype: card_grid
    tracker: "SLIDE 03 | THE DATA REALITY"
    title: "The Data Reality: Patient 360 Progress vs. Cross-Cycle Relational Lineage"
    subtitle: "Patient identity integration is actively advancing, while cross-cycle treatment links require clinical workflow reconciliation."
    columns: 2
    items:
      - title: "1. Patient 360 Master Data"
        subtitle: "ACTIVE INTEGRATION: 226.8K Regional Clinic Profiles Under Active MDM Reconciliation"
        metric: "226.8K"
        metric_label: "REGIONAL PROFILES IN ACTIVE SYNC"
        accent_key: "primary"
        bullets:
          - "**DE is actively reconciling clinic MR numbers** under shared PATIENT_GOLDEN_RECORD_ID profiles across branches."
          - "**Active pipeline tuning resolves multi-branch histories** to eliminate accidental surgical cycle drops."
      - title: "2. Cross-Cycle Treatment Lineage"
        subtitle: "OPERATIONAL GAP: Asynchronous Freeze-All Cycles Disconnect Surgical & Outcome Lineage"
        metric: "4 Stages"
        metric_label: "SEVERED LINEAGE (PREDICTIVE ML BLOCKED)"
        accent_key: "accent"
        bullets:
          - "**90–95% of Freeze-All cycles lack foreign keys** linking thawed embryos back to their surgical retrieval procedures."
          - "**67.2% of transfer records have unclosed Day-14 outcomes**, leaving predictive models without ground-truth labels."

  # Slide 05: Root Cause Analysis (Card Grid: 3 Columns)
  - archetype: card_grid
    tracker: "SLIDE 04 | ROOT CAUSE ANALYSIS"
    title: "The Root Cause: An Operational Data Input Issue, Not an ETL Defect"
    subtitle: "Data engineering cannot reconstruct or programmatically infer clinical events that were never entered in the clinic EMR."
    columns: 3
    items:
      - title: "1. Straw Attribution Gap"
        subtitle: "Physical straw IDs unrecorded at thaw"
        metric: "Zero FK"
        metric_label: "STRAW-TO-RETRIEVAL LINKAGE"
        accent_key: "accent"
        bullets:
          - "**Clinic EMR Capture:** Thaw logs in FACT_FET record transfer counts but omit which specific cryo straw was selected."
          - "**Downstream Reality:** DE pipelines cannot programmatically infer which retrieved egg produced the transferred embryo."
      - title: "2. Unclosed Outcome Records"
        subtitle: "Two-week follow-up stored in siloed notes"
        metric: "67.2%"
        metric_label: "UNCLOSED OUTCOME LABELS"
        accent_key: "accent"
        bullets:
          - "**EMR Workflow Timing:** Records in FACT_PREGNANCY_OUTCOME are created on transfer day but never updated with Beta-hCG."
          - "**Label Deficiency:** Without verified pregnancy closures, supervised ML models lack confirmed ground-truth target labels."
      - title: "3. Cartesian Multiplications"
        subtitle: "Ad-hoc joins produce 760x artificial inflation"
        metric: "760x"
        metric_label: "CARTESIAN EXPLOSION RISK"
        accent_key: "danger"
        bullets:
          - "**Cartesian Multiplication:** Joining FACT_OPU to FACT_FET across multi-cycle patients inflates row counts up to 760x."
          - "**Analytical Isolation:** Raw fact tables cannot be joined directly; multi-cycle patients require isolated CTE pre-aggregations."

  # Slide 06: The Operational Bridge (Browser Mockup with Real Streamlit UI)
  - archetype: browser_mockup
    tracker: "SLIDE 05 | THE OPERATIONAL BRIDGE"
    title: "The Bridge: Real-Time Treatment Journey & Missingness Dashboard"
    subtitle: "An interactive command center to audit treatment stages, identify data gaps per patient, and reconcile missing records."
    screenshot_path: "assets/images/mockups/streamlit_treatment_copilot.png"
    url: "https://morulaivf.snowflakecomputing.com/streamlit/uc2-copilot"
    telemetry_badges:
      - "🧬 Snowflake Streamlit"
      - "🔍 Zero-Query Frozen Benchmarks"
      - "🛡️ PII De-Identified"
      - "📊 Stage-Level Gap Audit"
    takeaways_title: "OPERATIONAL CAPABILITIES & WORKFLOW IMPACT"
    takeaways:
      - tag: "CLINIC & LAB STAFF"
        tag_color: "accent"
        title: "Patient-Level Stage Tracking"
        body: "Enables lab and clinic personnel to audit individual patients across all 4 stages (OPU, Embryo Lab, Transfer, Outcome), highlighting exactly which clinical data point is missing."
      - tag: "DATA ENGINEERING"
        tag_color: "primary"
        title: "Targeted Missingness Ledger"
        body: "Provides DE and IT teams with an aggregated hit-list of missing documentation stages across branches, replacing manual investigation with structured gap priorities."
      - tag: "PROJECT ALIGNMENT"
        tag_color: "accent"
        title: "The Single Truth Interface"
        body: "Serves as the common operational bridge between clinic staff, data engineering, and project leadership to reconcile records before any AI modeling is attempted."

  # Slide 07: Conclusion & Delivery Sequence (Card Grid: 2 Columns)
  - archetype: card_grid
    tracker: "SLIDE 06 | CONCLUSION & STRATEGIC ROADMAP"
    title: "The Conclusion: Operational Reconciliation Must Precede Predictive AI"
    subtitle: "Deploying machine learning on fractured data compromises clinical trust; our focus must shift to operational data capture."
    columns: 2
    items:
      - title: "Phase 1: Operational Data Reconciliation (Immediate Focus)"
        subtitle: "Deploy monitoring UI and calibrate clinic EMR capture workflows"
        metric: "Phase 1"
        metric_label: "CURRENT MILESTONE"
        accent_key: "accent"
        bullets:
          - "**Operationalize Streamlit:** Equip clinic teams with the journey UI to systematically identify and close missing outcomes."
          - "**Calibrate EMR Entry:** Partner with Pak Anton and clinic IT to mandate cryo straw barcode logging during thaw."
      - title: "Phase 2: Predictive Clinical Modeling (Future Milestone)"
        subtitle: "Train validated machine learning models once relational lineage is unbroken"
        metric: "Phase 2"
        metric_label: "FUTURE MILESTONE"
        accent_key: "primary"
        bullets:
          - "**Scientifically Valid ML:** Resume training predictive models once cross-cycle foreign keys are deterministically mapped."
          - "**Protected Clinical Trust:** Ensures AI delivered to Sp.OG clinicians is trained on mathematically verified data."

