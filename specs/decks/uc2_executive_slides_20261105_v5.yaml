    footnote: "*) Audited against Snowflake database TEST across staging schemas DM_JOURNEY, FACT_MNQ, FACT_SCIENTIFIC, and MARTS_CLINICAL."
    takeaway:
      badge: "DATA ARCHITECTURE LEDGER"
      accent_key: "primary"
      title: "Dimensional Roster: Separating Master Entities from Asynchronous Clinical Facts"
      description: "Dimensions (DM_PATIENT) anchor patient identities, while surgical and lab facts record discrete clinical interventions that must be reconciled deterministically."
