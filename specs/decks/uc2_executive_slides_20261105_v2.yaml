  # Slide 02: The Original Vision — End-to-End Pregnancy Prediction
  - archetype: card_grid
    tracker: "SLIDE 01 | THE CLINICAL VISION"
    title: "Predictive AI for IVF: The Clinical Pregnancy Success Engine"
    subtitle: "Evaluating pre-treatment success likelihood to guide patient counseling and protocol personalization."
    columns: 2
    items:
      - title: "The Clinical Promise & Strategic Value"
        subtitle: "Managing patient expectations upfront and reducing multi-cycle dropouts"
        icon: "target"
        badge: "CLINICAL VALUE"
        accent_key: "accent"
        bullets:
          - "Objective: Estimate clinical pregnancy success before starting hormonal stimulation."
          - "Value for Sp.OG Doctors: Set realistic expectations and personalize medication dosages."
          - "Value for Morula Leadership: Reduce emotional & financial dropouts; establish premier AI brand."
          - "Target Success Metrics: Baseline Accuracy >= 78%, AUC-ROC >= 0.82, sub-second inference in Magic EMR."
      - title: "The Intended Full-Funnel Architecture"
        subtitle: "Hypothetical continuous progression from stimulation to live birth"
        icon: "layers"
        badge: "HYPOTHESIS"
        accent_key: "primary"
        bullets:
          - "Day 1 (Maternal Baseline): Age, AMH, AFC, stimulation protocol, and FSH/LH dosages."
          - "Day 3–5 (Embryology Lab): Oocyte yield, 2PN fertilization, cleavage rate, and blastocyst conversion."
          - "Day 14+ (Outcome Verification): Serum Beta-hCG blood lab result, gestational sac, and live birth."
          - "Architectural Assumption: Presumes unbroken relational foreign keys across all treatment stages."

  # Slide 03: The Reality Check — The Cross-Cycle Cryo Severance
  - archetype: table
    tracker: "SLIDE 02 | THE DATA SEVERANCE"
    title: "The Data Reality: Full-Funnel ML Severed at Cryopreservation"
    subtitle: "90–95% of Morula cycles are Freeze-All; cross-cycle relational links are completely unmapped in EMR."
    footnote: "*) Empirical audit executed on Snowflake database TEST across 38,580 FET procedures and 27,659 outcome records."
    takeaway:
      badge: "CRITICAL STRATEGIC TAKEAWAY"
      accent_key: "danger"
      title: "Longitudinal ML is mathematically severed until straw-level tracking is resolved."
      description: "Over 90% of Morula IVF cycles freeze all embryos; without straw foreign keys linking thawed embryos to retrieval cycles, training predictive models on raw EMR joins causes 760x Cartesian explosion and misleading clinical metrics."
    columns:
      - header: "No."
        width: 0.50
        align: "CENTER"
        is_index: true
      - header: "Audited Dimension"
        width: 2.80
        align: "LEFT"
      - header: "Total Volume"
        width: 1.40
        align: "CENTER"
      - header: "Snowflake Audit Finding"
        width: 2.20
        align: "CENTER"
        is_status: true
      - header: "Operational & Machine Learning Consequence"
        width: 4.833
        align: "LEFT"
    rows:
      - ["01", "Frozen Embryo Transfers (FACT_FET)", "38,580 Rows", "100.0% OPU_DATE NULL", "Zero foreign keys link thawed embryo back to stimulation cycle."]
      - ["02", "Straw Physical Attribution (FACT_FET)", "38,580 Rows", "100.0% OOCYTE_NO NULL", "Thaws omit which retrieved egg became the transferred embryo."]
      - ["03", "Sentinel Placeholder Dates (FACT_FET)", "25,005 Rows", "64.8% CRITICAL FRACTURE", "Dates set to '1901-01-01'; cannot compute treatment intervals."]
      - ["04", "Day 14 Pregnancy Outcome Records", "18,586 Rows", "67.2% MISSING RESULT", "Outcomes created on transfer day; never updated with Beta-hCG."]
      - ["05", "Multi-Cycle Cartesian Multiplications", "36,080 Cycles", "760x ROW MULTIPLICATION", "Ad-hoc OPU-to-FET join inflates counts 42x to 760x on patients."]

  # Slide 04: The Lab Pivot — Shrinking Scope to Blastocyst Yield
  - archetype: card_grid
    tracker: "SLIDE 03 | THE LAB PIVOT"
    title: "Scoping Down to the Incubator: Blastocyst Yield & Its Empirical Limits"
    subtitle: "Confining ML to intra-cycle lab culture eliminates severance but exposes unstructured qualitative scores."
    columns: 3
    items:
      - title: "1. The Logical Scope Pivot"
        subtitle: "Retreating strictly to intra-cycle lab culture"
        icon: "shield"
        badge: "SCOPE PIVOT"
        accent_key: "primary"
        bullets:
          - "Hypothesis: Can we predict Day 5 Blastocyst Yield from fertilization?"
          - "Isolates development strictly to Day 1–5 incubator culture."
          - "Completely bypasses cross-cycle cryo severance and missing FET outcomes."
          - "Establishes clean clinical boundary between laboratory biology and patient transfer."
      - title: "2. The Perfect Join Foundation"
        subtitle: "100.0% deterministic relational linkage"
        icon: "database"
        badge: "100% INTEGRITY"
        accent_key: "success"
        bullets:
          - "FACT_OPU joins to FACT_EMBRYO on (CYCLE_ID, GROUP_ID) flawlessly."
          - "328,435 out of 328,435 embryo rows cleanly link to retrieval events."
          - "Zero orphan records across all 17 clinic branches."
          - "Golden Record patient resolution achieved for 99.96% of all cycles."
      - title: "3. The Labelling Dilemma"
        subtitle: "Target variable lacks international standardization"
        icon: "alert-triangle"
        badge: "DATA DEFICIT"
        accent_key: "danger"
        bullets:
          - "In FACT_EMBRYO.SCORE: 52.34% BLANK/Arrested; 47.66% subjective text."
          - "Informal labels ('Good', 'Moderat', 'Poor') with zero Gardner codes (4AA, 3BB)."
          - "Dual-source variance: Manual lab logbooks (M_) disagree with EMR (S_)."
          - "Predictive ML would model clinician charting habits rather than embryo biology."

