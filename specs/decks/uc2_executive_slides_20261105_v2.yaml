          - "Sub-50ms Serving Latency: Pre-materialized gold mart enables instant Magic EMR iframe loading."
          - "Deterministic Audit Gates: 4-gate journey verification (OPU -> Lab -> Thaw -> Outcome)."
      - title: "For Pak Anton & Data Engineering (The Bridge)"
